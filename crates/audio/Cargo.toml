[package]
name = "navify-audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }
rusty-opus = "1.0.0"
rtrb = "0.4.0"
rubato = "5.0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "flac", "aac", "isomp4", "ogg", "vorbis", "wav", "pcm", "alac", "mkv", "opt-simd", "id3v2"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync"] }

[dev-dependencies]
dotenvy = "0.15.7"
md-5 = "0.11.0"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1.0.151"
