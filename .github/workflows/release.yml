name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: navify
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: navify.exe
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: navify
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            bin: navify
            archive: tar.gz
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config
      - name: Build
        run: cargo build --profile dist --target ${{ matrix.target }} -p navify
      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/dist
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a "$GITHUB_WORKSPACE/navify-${{ matrix.target }}.zip" ${{ matrix.bin }}
          else
            tar czf "$GITHUB_WORKSPACE/navify-${{ matrix.target }}.tar.gz" ${{ matrix.bin }}
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: navify-${{ matrix.target }}.*
