name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage,pacman
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            formats: deb,appimage,pacman
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            formats: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            formats: dmg
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config
      - name: Tag matches the Cargo version
        if: github.ref_type == 'tag'
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(cargo pkgid | sed 's/.*[#@]//')"
      - run: cargo install --locked cargo-packager@0.11.8
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cargo packager --release --target ${{ matrix.target }} -f ${{ matrix.formats }} -o dist
      - if: runner.os == 'Linux'
        run: mv dist/PKGBUILD dist/PKGBUILD-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
            dist/PKGBUILD-*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
