[workspace]
members = []

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.90"

[package]
name = "navify"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
dirs = "7.0.0"
keyring-core = "1.0.0"
lru = "0.18.5"
md-5 = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls-no-provider",
    "query",
    "http2",
    "json",
    "gzip",
    "stream",
] }
rustls = { version = "0.23.45", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["fs", "macros", "rt-multi-thread", "sync"] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios"))))'.dependencies.dbus-secret-service-keyring-store]
version = "1.0.1"
features = ["crypto-rust"]

[target.'cfg(target_os = "macos")'.dependencies.apple-native-keyring-store]
version = "1.0.2"
features = ["keychain"]

[target.'cfg(target_os = "windows")'.dependencies.windows-native-keyring-store]
version = "1.1.0"
default-features = false

[dev-dependencies]
dotenvy = "0.15.7"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
