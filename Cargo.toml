[workspace]
members = ["crates/audio"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.90"

[package]
name = "navify"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A Spotify-style desktop client for Navidrome and OpenSubsonic servers"
repository = "https://github.com/pythoncrazy/navify"

[package.metadata.packager]
product-name = "Navify"
identifier = "io.github.pythoncrazy.navify"
category = "Music"
license-file = "LICENSE"
binaries = [{ path = "navify", main = true }]
icons = [
    "assets/icons/hicolor/32x32/apps/navify.png",
    "assets/icons/hicolor/128x128/apps/navify.png",
    "assets/icons/hicolor/256x256/apps/navify.png",
    "assets/icons/hicolor/512x512/apps/navify.png",
]

[package.metadata.packager.deb]
depends = ["libasound2t64 | libasound2", "libdbus-1-3"]
desktop-template = "assets/navify.desktop"
section = "sound"

[package.metadata.packager.pacman]
depends = ["alsa-lib", "dbus"]

[package.metadata.packager.nsis]
installer-icon = "assets/navify.ico"

[package.metadata.packager.macos]
minimum-system-version = "11.0"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
dirs = "7.0.0"
keyring-core = "1.0.0"
md-5 = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls-no-provider",
    "query",
    "http2",
    "json",
    "gzip",
    "stream",
] }
rustls = { version = "0.23.45", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["fs", "macros", "rt-multi-thread", "sync"] }
iced = { version = "0.14.0", default-features = false, features = [
    "advanced",
    "wgpu-bare",
    "tiny-skia",
    "tokio",
    "image-without-codecs",
    "lazy",
    "x11",
    "wayland",
    "web-colors",
    "thread-pool",
    "crisp",
] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
navify-audio = { path = "crates/audio" }
souvlaki = { version = "0.8.3", default-features = false, features = ["use_dbus"] }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2.190"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios"))))'.dependencies.dbus-secret-service-keyring-store]
version = "1.0.1"
features = ["crypto-rust"]

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9.12"
dbus-crossroads = "0.5.3"
wayland-client = "0.31.15"
wgpu = { version = "27.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies.wgpu]
version = "27.0.1"
default-features = false
features = ["std", "parking_lot", "wgsl", "metal"]

[target.'cfg(target_os = "windows")'.dependencies.wgpu]
version = "27.0.1"
default-features = false
features = ["std", "parking_lot", "wgsl", "dx12"]

[target.'cfg(target_os = "macos")'.dependencies.apple-native-keyring-store]
version = "1.0.2"
features = ["keychain"]

[target.'cfg(target_os = "windows")'.dependencies.windows-native-keyring-store]
version = "1.1.0"
default-features = false

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
dotenvy = "0.15.7"
iced_test = "0.14.0"
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package]
syn.opt-level = 0
quote.opt-level = 0
proc-macro2.opt-level = 0
navify-audio.opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
